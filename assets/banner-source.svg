<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Dickson Neoh — Founder and CTO, Edge and On-Prem AI</title>
  <desc id="desc">Dark blue technology banner connecting an edge processor to an on-prem server cluster.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0d1b33"/>
      <stop offset="1" stop-color="#14264a"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="1" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#9fb6d8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#background)"/>
  <rect width="1584" height="396" fill="url(#leftGlow)"/>
  <rect width="1584" height="396" fill="url(#rightGlow)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- Edge processor -->
  <g transform="translate(132 112)" opacity="0.9">
    <rect x="0" y="0" width="136" height="136" rx="24" fill="#0b1b2f" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="28" y="28" width="80" height="80" rx="14" fill="#0f2940" stroke="#67e8f9" stroke-width="2"/>
    <path d="M48 68h40M68 48v40" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M-12 28h12M-12 56h12M-12 80h12M-12 108h12"/>
      <path d="M136 28h12M136 56h12M136 80h12M136 108h12"/>
      <path d="M28-12v12M56-12v12M80-12v12M108-12v12"/>
      <path d="M28 136v12M56 136v12M80 136v12M108 136v12"/>
    </g>
  </g>

  <!-- On-prem servers -->
  <g transform="translate(1320 94)" opacity="0.9">
    <rect x="0" y="0" width="142" height="208" rx="18" fill="#11182f" stroke="#8b5cf6" stroke-opacity="0.75" stroke-width="2"/>
    <g fill="#18264a" stroke="#a78bfa" stroke-opacity="0.72">
      <rect x="18" y="20" width="106" height="42" rx="8"/>
      <rect x="18" y="82" width="106" height="42" rx="8"/>
      <rect x="18" y="144" width="106" height="42" rx="8"/>
    </g>
    <g fill="#c4b5fd" filter="url(#softGlow)">
      <circle cx="38" cy="41" r="4"/><circle cx="38" cy="103" r="4"/><circle cx="38" cy="165" r="4"/>
    </g>
    <g stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M54 41h50M54 103h50M54 165h50"/>
    </g>
  </g>

  <!-- Connection path -->
  <path d="M280 180 C410 110, 470 286, 600 206 S820 104, 950 196 S1130 270, 1318 198" fill="none" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
  <g fill="#dbeafe" filter="url(#softGlow)">
    <circle cx="365" cy="153" r="4"/><circle cx="520" cy="235" r="4"/><circle cx="1050" cy="224" r="4"/><circle cx="1208" cy="223" r="4"/>
  </g>

  <!-- Main copy -->
  <g text-anchor="middle" font-family="'DejaVu Sans', Arial, sans-serif">
    <text x="792" y="180" fill="#f8fafc" font-size="82" font-weight="800" letter-spacing="4">DICKSON <tspan fill="#60a5fa">NEOH</tspan></text>
    <rect x="598" y="210" width="388" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="792" y="260" fill="#dbeafe" font-size="30" font-weight="600" letter-spacing="3">FOUNDER &amp; CTO  •  EDGE &amp; ON-PREM AI</text>
  </g>
</svg>
